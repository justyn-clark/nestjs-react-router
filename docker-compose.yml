services:
  postgres:
    image: postgres:16-alpine
    container_name: nestjs-react-router-postgres
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${NRR_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nestjs-react-router-redis
    ports:
      - "${NRR_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs-react-router-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/appdb
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: dev-secret-change-me
      APP_INTERNAL_ORIGIN: http://127.0.0.1:3000
    ports:
      - "${NRR_APP_PORT:-3000}:3000"

volumes:
  postgres_data:
  redis_data:
